# =============================================================================
# packages/web/nginx.conf
# Configuración completa de Nginx para servir la SPA React en producción.
#
# Características:
#   - Compresión gzip para reducir el ancho de banda
#   - Caché agresiva para assets versionados (JS/CSS bundles con hash)
#   - Sin caché en index.html (punto de entrada de la SPA)
#   - SPA routing: redirige 404s a index.html para React Router
#   - Security headers: X-Frame-Options, CSP, nosniff, etc.
#   - Compatible con read_only: true (pid y temps en /tmp)
#   - Logs a stdout/stderr (Docker best practice)
# =============================================================================

user  nginx;
worker_processes  auto;

# Redirige el PID a /tmp para soporte de read_only: true en Docker.
# El /tmp del contenedor está montado como tmpfs en docker-compose.prod.yml.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirige todos los directorios temporales a /tmp para soporte read_only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Log estructurado a stdout (capturado por el driver json-file de Docker)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off; # No exponer versión de Nginx en cabeceras

    # -------------------------------------------------------------------------
    # Compresión gzip
    # Reduce hasta un 70% el tamaño de transferencia de assets de texto.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff2;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------
        # Security Headers
        # Aplicados en todos los responses del servidor.
        # ---------------------------------------------------------------------

        # Previene clickjacking: solo permite embeber en mismo origen
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Previene MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Activa el filtro XSS del navegador (legacy, pero inofensivo)
        add_header X-XSS-Protection "1; mode=block" always;

        # Controla información enviada en el Referer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Restringe acceso a APIs de hardware del navegador
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Content Security Policy:
        # - script-src 'self': solo scripts del propio origen
        # - style-src 'self' 'unsafe-inline': Chakra UI inyecta estilos inline
        # - img-src 'self' data: blob:: permite imágenes inline y blobs
        # - connect-src 'self': llamadas fetch/XHR solo al propio origen
        #   (ajustar si la API está en un dominio/puerto distinto)
        # - frame-ancestors 'none': equivale a X-Frame-Options DENY
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

        # ---------------------------------------------------------------------
        # SPA Routing
        # React Router maneja las rutas en el cliente. Nginx debe devolver
        # index.html para cualquier ruta que no corresponda a un archivo físico.
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------------------
        # Caché de assets estáticos
        # Vite genera bundles con hash en el nombre (ej: main-Bq3x7kRv.js).
        # Estos archivos son inmutables → caché de 1 año sin revalidación.
        # ---------------------------------------------------------------------
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 6M;
            add_header Cache-Control "public";
        }

        # ---------------------------------------------------------------------
        # Sin caché para el punto de entrada HTML
        # index.html NO tiene hash en el nombre y debe actualizarse en cada
        # deployment para que el navegador descargue los nuevos bundles.
        # ---------------------------------------------------------------------
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
