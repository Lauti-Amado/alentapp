# =============================================================================
# docker-compose.prod.yml
# Orquestación de producción para AlentApp: api, web y db.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod down
#
# Prerequisitos:
#   - Crear .env.prod a partir de .env.prod.example con los valores reales.
#   - VITE_API_URL debe ser la URL pública de la API (accesible desde el navegador).
# =============================================================================

name: alentapp-prod

services:

  # ---------------------------------------------------------------------------
  # db — PostgreSQL 16
  # Base de datos principal. No se aplica read_only porque PostgreSQL requiere
  # escritura en su directorio de datos.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: alentapp-db-prod
    restart: unless-stopped

    env_file: .env.prod

    volumes:
      # Volumen nombrado para persistencia de datos entre reinicios/actualizaciones
      - pgdata:/var/lib/postgresql/data

    networks:
      - alentapp-net

    healthcheck:
      # pg_isready verifica que el servidor acepta conexiones.
      # Las variables se resuelven desde env_file en tiempo de ejecución del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # api — Fastify + Prisma
  # Ejecuta migraciones pendientes antes de arrancar el servidor.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod

    container_name: alentapp-api-prod
    restart: unless-stopped

    # Ejecuta 'prisma migrate deploy' antes de iniciar el servidor.
    # migrate deploy aplica migraciones SQL pendientes de forma segura (no genera nuevas).
    # node_modules/.bin/prisma está disponible porque 'prisma' está en dependencies.
    command:
      - sh
      - -c
      - "printf 'DATABASE_URL=%s\\n' \"$DATABASE_URL\" > /tmp/.env && node node_modules/.bin/prisma migrate deploy --config packages/api/prisma.config.ts && node packages/api/dist/app.js"
    
    env_file: .env.prod

    ports:
      - "3000:3000"
      - "9464:9464"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - alentapp-net

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Hardening de seguridad:
    read_only: true       # Sistema de archivos del contenedor en solo lectura
    cap_drop:
      - ALL               # Elimina todas las Linux capabilities
    cap_add:
      - NET_BIND_SERVICE  # Permite binding a puertos (necesario en algunos entornos)
    security_opt:
      - no-new-privileges:true  # Impide escalada de privilegios vía setuid/setgid
    sysctls:
      net.ipv4.ping_group_range: "1 0"

    # /tmp necesita ser escribible (Node.js y algunos módulos escriben aquí temporalmente)
    tmpfs:
      - /tmp

  # ---------------------------------------------------------------------------
  # web — React SPA servida por Nginx
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
      args:
        # URL de la API accesible desde el navegador del cliente.
        # Se inyecta en el bundle de Vite en tiempo de compilación (build arg).
        # Ajustar a la URL pública real: https://api.tudominio.com
        VITE_API_URL: ${VITE_API_URL}

    container_name: alentapp-web-prod
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - api

    networks:
      - alentapp-net

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Hardening de seguridad:
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Nginx necesita bindear el puerto 80 (< 1024)
      - CHOWN             # chown temp dirs al usuario nginx (UID 101)
      - SETUID            # fork workers como nginx user
      - SETGID            # fork workers como nginx group
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ping_group_range: "1 0"

    # Nginx requiere estos directorios escribibles en runtime.
    # Se montan como tmpfs (en memoria) para compatibilidad con read_only: true.
    # El nginx.conf personalizado redirige pid y temp paths a /tmp.
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
  # ---------------------------------------------------------------------------
  # prometheus — Recolector de métricas
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: alentapp-prometheus-prod
    restart: unless-stopped

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    networks:
      - alentapp-net

    depends_on:
      - api

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # grafana — Visualización de métricas
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: alentapp-grafana-prod
    restart: unless-stopped

    ports:
      - "3001:3000"

    networks:
      - alentapp-net

    depends_on:
      - prometheus

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Redes
# Red interna bridge aislada. Los servicios no son accesibles desde el host
# salvo los puertos explícitamente publicados (web: 80).
# =============================================================================
networks:
  alentapp-net:
    driver: bridge

# =============================================================================
# Volúmenes
# pgdata persiste los datos de PostgreSQL entre reinicios y actualizaciones.
# =============================================================================
volumes:
  pgdata:
  grafana-data: